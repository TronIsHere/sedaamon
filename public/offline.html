<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#08080b" />
    <title>صدامون</title>
    <style>
      :root { color-scheme: dark; }
      html, body { height: 100%; margin: 0; }
      body {
        display: grid;
        place-items: center;
        padding: max(1rem, env(safe-area-inset-top)) 1rem max(1rem, env(safe-area-inset-bottom));
        box-sizing: border-box;
        background: #08080b;
        color: #f2f2f7;
        font-family: "Vazirmatn", Tahoma, system-ui, sans-serif;
        text-align: center;
      }
      img { width: 64px; height: 64px; border-radius: 16px; }
      h1 { margin: 1rem 0 0.25rem; font-size: 1.25rem; }
      p { margin: 0; color: #8e8e9c; font-size: 0.9rem; line-height: 1.8; }
      button {
        margin-top: 1.5rem;
        padding: 0.7rem 1.75rem;
        border: 0;
        border-radius: 999px;
        background: #6c5ce7;
        color: #fff;
        font: inherit;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" />
      <h1>اتصال به اینترنت برقرار نیست</h1>
      <p>صدامون بدون اینترنت باز نمی‌شود. اتصال را بررسی کنید و دوباره امتحان کنید.</p>
      <button onclick="location.reload()">تلاش دوباره</button>
    </main>
    <script>
      window.addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
