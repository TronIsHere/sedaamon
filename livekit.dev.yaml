# Local development LiveKit config (npm run livekit). The key is for local use only.
port: 7880
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50200
  use_external_ip: false
keys:
  devkey: devsecret-local-only-not-for-production
webhook:
  api_key: devkey
  urls:
    - http://127.0.0.1:3100/api/livekit/webhook
logging:
  level: info
