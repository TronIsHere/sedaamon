# /etc/nginx/sites-available/sedaamon
# Replace example.ir with your domain and point the certificate paths at your certs.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name example.ir rtc.example.ir;
    return 301 https://$host$request_uri;
}

# Web app + Socket.io
server {
    listen 443 ssl;
    http2 on;
    server_name example.ir;

    ssl_certificate     /etc/ssl/sedaamon/example.ir.fullchain.pem;
    ssl_certificate_key /etc/ssl/sedaamon/example.ir.key;

    client_max_body_size 10m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
    }
}

# LiveKit signaling (WebSocket). Media goes directly to the server on UDP 50000-60000.
server {
    listen 443 ssl;
    http2 on;
    server_name rtc.example.ir;

    ssl_certificate     /etc/ssl/sedaamon/rtc.example.ir.fullchain.pem;
    ssl_certificate_key /etc/ssl/sedaamon/rtc.example.ir.key;

    location / {
        proxy_pass http://127.0.0.1:7880;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }
}
