# /etc/nginx/sites-available/sedaamon
# Replace example.ir with your domain and point the certificate paths at your certs.

# Slows down guessing of login codes and SMS flooding: 10 requests a minute per IP on /api/auth/*.
limit_req_zone $binary_remote_addr zone=sedaamon_auth:10m rate=10r/m;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name example.ir rtc.example.ir;
    return 301 https://$host$request_uri;
}

# Web app + Socket.io
server {
    listen 443 ssl;
    http2 on;
    server_name example.ir;

    ssl_certificate     /etc/ssl/sedaamon/example.ir.fullchain.pem;
    ssl_certificate_key /etc/ssl/sedaamon/example.ir.key;

    client_max_body_size 10m;

    location /api/auth/ {
        limit_req zone=sedaamon_auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Film uploads from the admin panel: big, so passed straight through to the app as they arrive instead of buffered here.
    # (Downloads from a link are fetched by the app itself and never pass through here.)
    # Keep client_max_body_size at or above MOVIE_MAX_MB.
    location = /api/movies {
        client_max_body_size 5g;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
    }
}

# LiveKit signaling (WebSocket). Media goes directly to the server on UDP 50000-60000.
server {
    listen 443 ssl;
    http2 on;
    server_name rtc.example.ir;

    ssl_certificate     /etc/ssl/sedaamon/rtc.example.ir.fullchain.pem;
    ssl_certificate_key /etc/ssl/sedaamon/rtc.example.ir.key;

    location / {
        proxy_pass http://127.0.0.1:7880;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 1h;
    }
}
